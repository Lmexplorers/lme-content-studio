<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LME Autopilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
@font-face{font-family:'Sasson Montessori';src:url('/SassoonMontessori.woff2') format('woff2'),url('/SassoonMontessori.ttf') format('truetype');font-weight:normal;font-style:normal;font-display:swap;}

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Sasson Montessori';
    min-height: 100vh;
    background: linear-gradient(135deg, #FCE4EE 0%, #FFFBEF 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    text-align: center;
    max-width: 480px;
    width: 100%;
  }
  .flower { font-size: 56px; margin-bottom: 16px; }
  h1 {
    font-family: 'Playpen Sans';
    font-size: 40px;
    color: #F02478;
    margin-bottom: 8px;
    font-weight: 900;
  }
  .tagline {
    font-size: 18px;
    color: #6B6470;
    margin-bottom: 40px;
    font-style: italic;
  }
  .choose {
    font-size: 14px;
    color: #6B6470;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 24px;
  }
  .lang-btn {
    display: block;
    width: 100%;
    padding: 22px 24px;
    margin-bottom: 16px;
    background: linear-gradient(120deg, #F02478 0%, #C81860 100%);
    border: 2px solid transparent;
    border-radius: 16px;
    color: #fff;
    font-family: 'Sasson Montessori';
    font-size: 18px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 8px 22px rgba(240,36,120,.25);
  }
  .lang-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(240,36,120,.38);
    filter: brightness(1.04);
  }
  .lang-btn .flag { font-size: 28px; margin-right: 12px; vertical-align: middle; }
  .footer {
    margin-top: 40px;
    font-size: 13px;
    color: #6B6470;
  }
  .footer a { color: #F02478; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
  <div class="container">
    <div class="flower">🌸</div>
    <h1>LME Autopilot</h1>
    <p class="tagline">AI-powered content for creators</p>
    
    <p class="choose">Choose your language · Velg språk</p>
    
    <a href="/en.html" class="lang-btn" onclick="huskSprak('en')">
      <span class="flag">🇬🇧</span> English
    </a>
    
    <a href="/no.html" class="lang-btn" onclick="huskSprak('no')">
      <span class="flag">🇳🇴</span> Norsk
    </a>
    
    <p class="footer">
      Visit <a href="https://lmexplorers.com">lmexplorers.com</a>
    </p>
  </div>
  <script>
/* Språkvalget sto som et steg hver eneste gang appen ble åpnet, uten at det
   ble husket. Nå huskes det, og du sendes rett inn. Vil du velge på nytt,
   åpner du /?sprak=1, eller trykker "Språk" i Mer-menyen.
   Renate 4. september 2026. */
function huskSprak(l){ try{ localStorage.setItem('lme_lang', l); }catch(e){} }
(function(){
  try{
    var q = new URLSearchParams(location.search);
    if(q.get('sprak')==='1'){ try{ localStorage.removeItem('lme_lang'); }catch(e){} return; }
    var l = localStorage.getItem('lme_lang');
    if(l==='no' || l==='en'){
      location.replace('/'+l+'.html'+(location.search||''));
    }
  }catch(e){}
})();
</script>
<script>
  // Auto-tilgang: åpnes Studio fra Dashboard med ?key=..., lås opp for hele enheten.
  // localStorage deles på tvers av index/no/en (samme origin), så språksidene er opplåst.
  (function(){
    var VALID_KEYS = ['LME2026','LME-PRO-2026','LME-FAMILY-2026'];
    try{
      var k = new URLSearchParams(window.location.search).get('key');
      if(k && VALID_KEYS.indexOf(k.toUpperCase())>=0){
        localStorage.setItem('lme_access_granted','yes');
      }
    }catch(e){}
    // Ta med nøkkelen videre til språksiden også, for sikkerhets skyld.
    try{
      var q = window.location.search || '';
      if(q){ document.querySelectorAll('a.lang-btn').forEach(function(a){ a.href = a.getAttribute('href') + q; }); }
    }catch(e){}
  })();
  </script>
</body>
</html>
